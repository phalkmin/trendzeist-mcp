# Publishes to PyPI via Trusted Publishing (no API token needed).
# One-time setup: https://pypi.org/manage/account/publishing/
#   PyPI project: trendzeist-mcp | owner: phalkmin | repo: trendzeist-mcp
#   workflow: publish.yml | environment: pypi
# Then: git tag v0.1.0 && git push --tags
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify tag matches pyproject and server.json versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(uvx --from toml-cli toml get --toml-path pyproject.toml project.version)"
          test "$TAG" = "$VER" || { echo "tag $TAG != pyproject version $VER"; exit 1; }
          SJ="$(python3 -c 'import json;d=json.load(open("server.json"));print(d["version"], d["packages"][0]["version"])')"
          test "$SJ" = "$TAG $TAG" || { echo "server.json versions ($SJ) != tag $TAG"; exit 1; }
      # Publishing is gated on the offline suite for the *tagged* commit; CI on
      # main is a separate workflow and may not have run (or passed) for this ref.
      - run: uv sync --group dev
      - run: uv run pytest -q
      - name: Server starts and answers initialize
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | uv run trendzeist-mcp | grep -q '"serverInfo"'
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  github-release:
    needs: [pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

# Google's Trends endpoints are undocumented and change without notice.
# This job hits them for real once a week so breakage is noticed early.
name: Live canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Live tests against Google Trends
        env:
          TRENDZEIST_MIN_INTERVAL: "4"
          TRENDZEIST_CACHE_DIR: off
        run: uv run pytest -q -m live -p no:cacheprovider tests/test_live_canary.py
